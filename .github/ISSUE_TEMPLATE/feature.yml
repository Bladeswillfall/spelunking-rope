name: Feature proposal
description: Propose a gameplay or integration capability
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What player or modpack problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: architecture
    attributes:
      label: Architectural impact
      description: Does this affect core, common, loader adapters, persistence, networking, or integrations?
