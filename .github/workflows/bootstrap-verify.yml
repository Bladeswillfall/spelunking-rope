name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test pure-Java core
        run: gradle :core:test
      - name: Benchmark dense rope runtime
        run: gradle :core:benchmarkRopeRuntime
      - name: Verify architecture boundaries
        shell: bash
        run: |
          if grep -R -E 'net\.minecraft|net\.fabricmc|net\.minecraftforge|dev\.architectury' core/src 2>/dev/null; then
            echo 'core must remain pure Java'
            exit 1
          fi
          if grep -R -E 'net\.fabricmc|net\.minecraftforge' common/src 2>/dev/null; then
            echo 'common must not import loader APIs'
            exit 1
          fi
          gradle :core:dependencies --configuration compileClasspath > core-dependencies.txt
          if grep -E 'minecraft|fabric|forge|architectury' core-dependencies.txt; then
            echo 'core compile classpath contains a forbidden platform dependency'
            exit 1
          fi

  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test shared Minecraft code
        run: gradle :common:test --stacktrace
      - name: Benchmark fixed-rope snapshot
        run: gradle :common:benchmarkRopeSnapshot

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build Fabric
        run: gradle :fabric:build --stacktrace
      - name: Verify Fabric artifact
        shell: bash
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          JAR="fabric/build/libs/spelunking-rope-fabric-$VERSION.jar"
          test -f "$JAR"
          unzip -p "$JAR" fabric.mod.json > /tmp/fabric.mod.json
          grep -q '"id": "spelunking_rope"' /tmp/fabric.mod.json
          grep -q "\"version\": \"$VERSION\"" /tmp/fabric.mod.json
      - uses: actions/upload-artifact@v4
        with:
          name: spelunking-rope-fabric
          path: fabric/build/libs/spelunking-rope-fabric-*.jar

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build Forge
        run: gradle :forge:build --stacktrace
      - name: Verify Forge artifact
        shell: bash
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          JAR="forge/build/libs/spelunking-rope-forge-$VERSION.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/mods.toml > /tmp/mods.toml
          grep -q 'modId = "spelunking_rope"' /tmp/mods.toml
          grep -q "version = \"$VERSION\"" /tmp/mods.toml
      - uses: actions/upload-artifact@v4
        with:
          name: spelunking-rope-forge
          path: forge/build/libs/spelunking-rope-forge-*.jar

  server:
    needs: [common, fabric, forge]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: true
      - name: Boot ${{ matrix.loader }} dedicated server
        shell: bash
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          LOG="$LOADER-server.log"
          mkdir -p "$LOADER/run"
          echo 'eula=true' > "$LOADER/run/eula.txt"

          gradle ":$LOADER:runServer" --no-daemon > "$LOG" 2>&1 &
          SERVER_PID=$!

          READY=0
          for _ in $(seq 1 240); do
            if grep -q 'Done (' "$LOG" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat "$LOG"
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true

          test "$READY" -eq 1
          grep -q 'Spelunking Rope initialized' "$LOG"

  client:
    needs: [common, fabric, forge]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"
          cache-read-only: true
      - name: Boot ${{ matrix.loader }} client
        shell: bash
        env:
          LOADER: ${{ matrix.loader }}
        run: |
          LOG="$LOADER-client.log"
          xvfb-run -a gradle ":$LOADER:runClient" --no-daemon > "$LOG" 2>&1 &
          CLIENT_PID=$!

          READY=0
          for _ in $(seq 1 240); do
            if grep -q 'Reloading ResourceManager' "$LOG" 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          cat "$LOG"
          kill "$CLIENT_PID" 2>/dev/null || true
          wait "$CLIENT_PID" 2>/dev/null || true

          test "$READY" -eq 1
          grep -q 'Spelunking Rope initialized' "$LOG"
